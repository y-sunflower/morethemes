name: Check static typing

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-typing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: |
          uv sync --all-groups
          uv pip install brand_yml # for some reason I need to add this manually

      - name: Run type check (ty)
        run: uv run ty check

      - name: Run type check (pyrefly)
        run: uv run pyrefly check
